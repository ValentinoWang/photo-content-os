<div data-t="1.18" data-m="push"><svg class="abs" style="left:440px;top:1000px" width="200" height="120" viewBox="-100 -60 200 120">
  <path d="M-92 0 Q0 -96 92 0 Q0 96 -92 0Z" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
  <circle r="26" fill="#fff"/></svg></div>
<script>
const D = 2.2;

const CUT = 0.7 * D;
const at = (s, dur = 0.35) => Math.max(0, Math.min(s, CUT - dur));
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const P = (t, s, d = 0.35) => ease((t - at(s, d)) / d);
const $ = id => document.getElementById(id);
function reveal(t) {
  for (const el of document.querySelectorAll('[data-t]')) {
    const p = P(t, +el.dataset.t);
    const m = el.dataset.m || 'up';
    el.style.opacity = p;
    if (m === 'up') el.style.translate = `0 ${Math.round((1 - p) * 30)}px`;
    else if (m === 'push') el.style.translate = `0 ${Math.round((1 - p) * 160)}px`;
    else if (m === 'pop') el.style.scale = String(0.6 + 0.4 * p);
  }
}

function scene(t) {}
window.seekFrame = (frame, fps) => {
  const t = frame / fps;
  reveal(t);
  scene(t);
};
window.seekFrame(0, 30);
</script>
