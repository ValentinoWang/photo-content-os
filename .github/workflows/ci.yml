name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: .venv/bin/python -m compileall scripts
      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests
      - name: Check local documentation contract
        run: .venv/bin/python scripts/check_outline_contract.py . --skip-obsidian-sync
      - name: Validate review capability registry
        run: .venv/bin/python scripts/validate_review_capability_registry.py
      - name: Enforce repository safety boundary
        run: .venv/bin/python scripts/check_repository_safety.py
      - name: Run synthetic trial
        run: >-
          .venv/bin/python scripts/create_demo_project.py
          --workspace-root "$RUNNER_TEMP/photo-content-os-demo"
          --project-name ci_demo
