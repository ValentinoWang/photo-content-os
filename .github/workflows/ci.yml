name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall 99_System_OpenClaw/scripts
      - name: Run unit tests
        run: python -m unittest discover -s 99_System_OpenClaw/tests
      - name: Check local documentation contract
        run: python 99_System_OpenClaw/scripts/06_check_outline_contract.py . --skip-obsidian-sync
      - name: Validate review capability registry
        run: python 99_System_OpenClaw/scripts/36_validate_review_capability_registry.py
      - name: Enforce repository safety boundary
        run: python 99_System_OpenClaw/scripts/40_check_repository_safety.py
      - name: Run synthetic trial
        run: >-
          python 99_System_OpenClaw/scripts/39_create_demo_project.py
          --workspace-root "$RUNNER_TEMP/photo-content-os-demo"
          --project-name ci_demo
