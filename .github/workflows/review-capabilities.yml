name: Review capability registry

on:
  pull_request:
    paths:
      - "review-capabilities.registry.json"
      - "scripts/validate_review_capability_registry.py"
      - "scripts/review_output_video.py"
      - "scripts/mac_openclaw_runner.py"
      - "tests/test_review_capability_registry.py"
      - "tests/test_output_video_review.py"
      - "tests/test_mac_openclaw_runner.py"
      - "docs/usage-guides/**"
      - ".github/workflows/review-capabilities.yml"
  push:
    branches:
      - main
    paths:
      - "review-capabilities.registry.json"
      - "scripts/validate_review_capability_registry.py"
      - "scripts/review_output_video.py"
      - "scripts/mac_openclaw_runner.py"
      - "tests/test_review_capability_registry.py"
      - "tests/test_output_video_review.py"
      - "tests/test_mac_openclaw_runner.py"
      - "docs/usage-guides/**"

jobs:
  validate-review-capabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python3 -m pip install PyYAML
      - name: Validate registry
        run: python3 scripts/validate_review_capability_registry.py
      - name: Run registry and runner contract tests
        run: |
          python3 -m unittest tests/test_review_capability_registry.py
          python3 -m unittest tests/test_mac_openclaw_runner.py
