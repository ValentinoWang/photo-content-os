project:
  name: photo-content-os
  profile: core
design:
  token_sources:
    - evidence/2026-09-01/openclaw-media-ui-prototype-and-checklist/openclaw-media-ui-prototype.html
  theme_sources:
    - studio/static/styles.css
  page_shell_sources:
    - studio/static/index.html
  component_sources:
    - studio/static/app.js
quality:
  static_guards:
    - command: .venv/bin/python scripts/validate_music_analysis_registry.py
      failure_class: music-analysis-registry
      repair: repair schema, published IDs, version, changelog or UI copy; see docs/music-analysis-registry-guard.md
    - command: .venv/bin/python scripts/check_repository_safety.py --base origin/main
      failure_class: repository-private-media/repository-local-path/repository-path-baseline-stale
      repair: move media outside Git, use paths relative to the media root, and shrink stale baseline entries; see docs/repository-privacy-guard.md
    - command: .venv/bin/python -m unittest tests.test_full_checklist_acceptance tests.test_desktop_openapi_route_sync
      failure_class: studio-contract-route-drift
      repair: regenerate studio-openapi.json from studio.api_contract and keep server registration on canonical ROUTE_SPECS
    - command: .venv/bin/python scripts/check_repository_safety.py --runtime-paths-only
      failure_class: machine-runtime-path
      repair: use repository-owned tool paths or explicit environment configuration; see docs/edit-tools-runtime-guard.md
  formatting: []
qa:
  screenshot:
    - id: openclaw-media-eight-surfaces-two-viewports
      command: node scripts/capture-studio-surfaces.mjs --base-url http://127.0.0.1:8765
      capture_matrix: evidence/2026-09-02/openclaw-media-full-checklist-implementation/.ssot/source-requirements.json
      baseline_root: evidence/2026-09-02/openclaw-media-full-checklist-implementation/acceptance-fragments/ocm-z1/acceptance/visual-fidelity/baselines
      evidence_root: evidence/2026-09-02/openclaw-media-full-checklist-implementation/acceptance-fragments/ocm-z1/acceptance/visual-fidelity/runs
      expected_capture_count: 16
  integration:
    - tests/test_full_checklist_acceptance.py
    - tests/test_desktop_openapi_route_sync.py
  evidence_root: evidence
skills:
  enabled: []
