<!DOCTYPE html>
<!-- 来源：typography/blur-slide；上游提交 3ac67b75dd0b3bc2fd807c17f6b7ce35373eef3d --><html lang="zh"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f3efe6;color:#202329;font-family:'STHeiti','Heiti SC',sans-serif} .page{position:absolute;left:50%;top:850px;width:max-content;transform:translate(-50%,-50%)}.eyebrow{font-size:50px;color:#ab4a36;letter-spacing:5px}.line{display:flex;gap:24px;font-size:180px;line-height:1.65;white-space:nowrap}.line span,.sub span{display:inline-block}.accent{color:#ab4a36}.sub{display:flex;gap:14px;font-size:52px;line-height:1.4;margin-top:35px;white-space:nowrap}
</style></head><body data-hold="2.7-4"><div class="page" data-role="header"><div class="eyebrow">一段新的开始</div><div class="line"><span>让想法</span><span class="accent">逐渐</span></div><div class="line"><span>变成</span><span>画面</span></div><div class="sub"><span>从一个</span><span>清晰的</span><span>画面开始</span></div></div><script>
const D=4;const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>1-Math.pow(1-clamp(x),5);const main=[...document.querySelectorAll('.line span')],sub=[...document.querySelectorAll('.sub span')];function apply(el,p,dy,blur){el.style.opacity=el.closest('.line')?0.18+0.82*p:p;el.style.transform=`translateY(${(1-p)*dy}px)`;el.style.filter=`blur(${(1-p)*blur}px)`}window.seekFrame=function(frame,fps){main.forEach((e,i)=>apply(e,ease((frame-(10+i*4+(i>=2?6:0)))/(i===3?30:22)),44,13));sub.forEach((e,i)=>apply(e,ease((frame-(34+i*2.4))/20),20,7))};window.seekFrame(0,30);
</script></body></html>
