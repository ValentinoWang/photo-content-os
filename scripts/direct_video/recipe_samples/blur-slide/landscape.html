<!DOCTYPE html>
<!-- 来源：blur-slide；上游提交 3ac67b75dd0b3bc2fd807c17f6b7ce35373eef3d -->
<html lang="zh"><head><meta charset="utf-8"><style>
:root{--ink:#121317;--paper:#f3eee6;--accent:#ff5b2e;--mute:#8b8f98;--line:rgba(243,238,230,.14)}

html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:'PingFang SC','STHeiti','Heiti SC',sans-serif}
.bug{position:absolute;left:120px;right:120px;top:80px;display:flex;justify-content:space-between;align-items:center;font-size:30px;letter-spacing:4px;color:var(--mute)}.bug b{color:var(--paper);font-weight:600;letter-spacing:6px}.bug i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:18px;vertical-align:middle}.rule{position:absolute;left:120px;right:120px;top:150px;height:2px;background:var(--line)}
.foot{position:absolute;left:120px;right:120px;bottom:90px;display:flex;justify-content:space-between;font-size:30px;color:var(--mute);letter-spacing:2px}.foot span:last-child{color:var(--paper)}.eyebrow{font-size:40px;color:var(--accent);letter-spacing:8px;font-weight:600}.page{position:absolute;left:120px;top:290px}.eyebrow{margin-bottom:48px}.line{display:block;font-size:132px;line-height:1.25;font-weight:700;white-space:nowrap}.line span,.sub span{display:inline-block}.accent{color:var(--accent)}.sub{font-size:44px;margin-top:55px;white-space:nowrap}
</style></head><body data-hold="2.7-4"><div class="bug" data-role="header"><span><i></i><b>制作台</b></span><span>宣传片 · 01</span></div><div class="rule"></div><div class="page" data-role="header"><div class="eyebrow">写好台词以后</div><div class="line"><span>画面</span><span class="accent">交给它</span></div><div class="line"><span>你只管</span><span>说</span></div><div class="sub"><span>按音乐小节出片，</span><span>不用自己对轴</span></div></div><div class="foot"><span>125 BPM · 4/4</span><span>第 1–3 小节</span></div><script>
const D=4;const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>1-Math.pow(1-clamp(x),5);const main=[...document.querySelectorAll('.line span')],sub=[...document.querySelectorAll('.sub span')];function apply(el,p,dy,blur){el.style.opacity=el.closest('.line')?0.18+0.82*p:p;el.style.transform=`translateY(${(1-p)*dy}px)`;el.style.filter=`blur(${(1-p)*blur}px)`}window.seekFrame=function(frame,fps){main.forEach((e,i)=>apply(e,ease((frame-(10+i*4+(i>=2?6:0)))/(i===3?30:22)),64,18));sub.forEach((e,i)=>apply(e,ease((frame-(34+i*2.4))/20),26,9))};window.seekFrame(0,30);
</script></body></html>
