<!DOCTYPE html>
<!-- 来源：gauge-readout-moves；上游提交 3ac67b75dd0b3bc2fd807c17f6b7ce35373eef3d -->
<html lang="zh"><head><meta charset="utf-8"><style>
:root{--ink:#121317;--paper:#f3eee6;--accent:#ff5b2e;--mute:#8b8f98;--line:rgba(243,238,230,.14)}

html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:'PingFang SC','STHeiti','Heiti SC',sans-serif}
.bug{position:absolute;left:120px;right:120px;top:80px;display:flex;justify-content:space-between;align-items:center;font-size:30px;letter-spacing:4px;color:var(--mute)}.bug b{color:var(--paper);font-weight:600;letter-spacing:6px}.bug i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:18px;vertical-align:middle}.rule{position:absolute;left:120px;right:120px;top:150px;height:2px;background:var(--line)}
.foot{position:absolute;left:120px;right:120px;bottom:90px;display:flex;justify-content:space-between;font-size:30px;color:var(--mute);letter-spacing:2px}.foot span:last-child{color:var(--paper)}.eyebrow{font-size:40px;color:var(--accent);letter-spacing:8px;font-weight:600}.page{position:absolute;left:120px;top:310px}.gauge{position:absolute;left:1060px;top:230px;width:690px;height:580px;display:flex;align-items:center;gap:35px}.ruler{position:relative;width:240px;height:100%;overflow:hidden}.scale{position:absolute;left:0;right:0;top:0}.tick{height:40px;display:flex;align-items:center;gap:20px;font-size:34px;color:var(--mute)}.tick:before{content:'';width:68px;height:2px;background:var(--paper)}.pointer{font-size:50px;color:var(--accent);transform:translateY(-54px)}.reading{background:var(--accent);color:var(--paper);font-size:140px;font-weight:700;padding:24px}.unit{font-size:40px}.copy{position:absolute;left:120px;top:550px;font-size:44px;white-space:nowrap}
</style></head><body><div class="bug" data-role="header"><span><i></i><b>制作台</b></span><span>宣传片 · 03</span></div><div class="rule"></div><div class="page" data-role="header"><div class="eyebrow">先读你的配乐</div></div><div class="gauge"><div class="ruler"><div class="scale"><div class="tick">180</div><div class="tick">170</div><div class="tick">160</div><div class="tick">150</div><div class="tick">140</div><div class="tick">130</div><div class="tick">120</div><div class="tick">110</div><div class="tick">100</div><div class="tick">90</div><div class="tick">80</div><div class="tick">70</div><div class="tick">60</div></div></div><div class="pointer">◀</div><div class="reading" id="value">125</div><div class="unit">BPM</div></div><div class="copy">每一刀都切在重拍上</div><div class="foot"><span>4/4 拍</span><span>每小节 1.92 秒</span></div><script>
const D = 5.0;const scale=document.querySelector('.scale'),value=document.getElementById('value');const ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);window.seekFrame=(frame,fps)=>{const f=frame*30/fps*110/45;let v;if(f<32){v=20+20*f/32}else if(f<37){v=40-2*(f-32)/5}else if(f<59){v=38+100*ease((f-37)/22)}else if(f<110){const t=(f-59)/51;v=130+8*Math.exp(-7*t)*Math.cos(16*t)}else{v=130}v=60+(v-20)*65/110;scale.style.transform=`translateY(${(v-125)*4}px)`;value.textContent=Math.round(v)};window.seekFrame(0,30);
</script></body></html>
