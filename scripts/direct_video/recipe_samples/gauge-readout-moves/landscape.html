<script>const D = 5.0;
const scale = document.getElementById('scale'); const value = document.getElementById('value');
const ease = x => 1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
window.seekFrame = (frame, fps) => { const f=frame*30/fps*110/45; let v;if(f<32){v=20+20*f/32;}else if(f<37){v=40-2*(f-32)/5;}else if(f<59){v=38+100*ease((f-37)/22);}else if(f<110){const t=(f-59)/51;v=130+8*Math.exp(-7*t)*Math.cos(16*t);}else{v=130;} scale.setAttribute('transform',`translate(0 ${v*5})`);value.textContent=Math.round(v);};
window.seekFrame(0,30);</script></body></html>
