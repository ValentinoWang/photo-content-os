<!DOCTYPE html>

<html lang="zh"><head><meta charset="utf-8"><style>
:root{--ink:#121317;--paper:#f3eee6;--accent:#ff5b2e;--mute:#8b8f98;--line:rgba(243,238,230,.14)}

html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:'PingFang SC','STHeiti','Heiti SC',sans-serif}
.bug{position:absolute;left:120px;right:120px;top:80px;display:flex;justify-content:space-between;align-items:center;font-size:30px;letter-spacing:4px;color:var(--mute)}.bug b{color:var(--paper);font-weight:600;letter-spacing:6px}.bug i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:18px;vertical-align:middle}.rule{position:absolute;left:120px;right:120px;top:150px;height:2px;background:var(--line)}
.foot{position:absolute;left:120px;right:120px;bottom:90px;display:flex;justify-content:space-between;font-size:30px;color:var(--mute);letter-spacing:2px}.foot span:last-child{color:var(--paper)}.eyebrow{font-size:40px;color:var(--accent);letter-spacing:8px;font-weight:600}.page{position:absolute;left:120px;top:330px}.title{font-size:130px;font-weight:700;margin-top:50px}.blocks{position:absolute;left:1010px;top:390px;display:flex;gap:12px}.block{width:180px;height:180px;border:3px solid var(--accent);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:100px;font-weight:700}.block.on{background:var(--accent);color:var(--paper)}.copy{position:absolute;left:120px;top:670px;font-size:44px;white-space:nowrap}
</style></head><body><div class="bug" data-role="header"><span><i></i><b>制作台</b></span><span>宣传片 · 04</span></div><div class="rule"></div><div class="page" data-role="header"><div class="eyebrow">跟着鼓点换镜</div><div class="title">第 3 小节</div></div><div class="blocks"><div class="block">1</div><div class="block">2</div><div class="block">3</div><div class="block">4</div></div><div class="copy">镜头长短按小节算，不按秒猜</div><div class="foot"><span>125 BPM</span><span>换镜</span></div><script>
const D = 5.0;const blocks=[...document.querySelectorAll('.block')];window.seekFrame=(frame,fps)=>{const f=frame*30/fps;const cuts=[0,30,52,70];blocks.forEach((el,i)=>{const dt=f-cuts[i];el.classList.toggle('on',dt>=0);const settle=i&&dt>=0?Math.max(0,1-dt/6):0;el.style.transform=`scale(${1+0.03*settle})`})};window.seekFrame(0,30);
</script></body></html>
