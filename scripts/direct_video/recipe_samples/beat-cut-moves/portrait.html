</style></head><body><header data-role="header">关键时刻<small>同一画面的三次靠近</small></header><svg viewBox="0 0 1080 1920"><g id="scene"><rect x="180.0" y="410" width="720" height="600" rx="30" fill="#d9e5dd"/><circle cx="540.0" cy="605" r="100" fill="#bb6b3e"/><path d="M 486.0 605 l 38 40 l 74-82" fill="none" stroke="#fff" stroke-width="16"/><text x="540.0" y="800" text-anchor="middle" font-size="64" fill="#173b29">年度亮点</text><text x="540.0" y="880" text-anchor="middle" font-size="38" fill="#315843">关键时刻</text></g><rect id="focus" x="270.0" y="490" width="540" height="440" fill="none" stroke="#bd6632" stroke-width="5"/><text id="saved" x="540.0" y="1060" text-anchor="middle" font-size="36" fill="#315843">已定格</text><rect id="flash" width="1080" height="1920" fill="white"/></svg>
<script>const D = 5.0;
const scene=document.getElementById('scene'), flash=document.getElementById('flash'), focus=document.getElementById('focus'), saved=document.getElementById('saved');
window.seekFrame = (frame,fps) => {const f=frame*30/fps; const cuts=[30,52,70]; const step=f<30?0:f<52?1:f<70?2:3;const base=[1,1,1.6,2.8][step];const last=step?cuts[step-1]:0;const dt=f-last;const settle=step?Math.max(0,1-dt/6):0;const live=step===0?1+0.025*Math.min(f/30,1):1;const push=step===3?1+0.015*Math.min(dt/70,1):1; const zoom=base*(1+0.03*settle)*live*push;const targetY=step===3?605:710;scene.setAttribute('transform',`translate(540.0 ${710-16*settle}) scale(${zoom}) translate(-540.0 -${targetY})`);const next=cuts.find(x=>x>f);focus.style.opacity=next && next-f<=8?'1':'0';const q=next?Math.max(0,Math.min(1,(8-(next-f))/8)):0;focus.setAttribute('transform',`translate(540.0 710) scale(${1.3-0.3*q}) translate(-540.0 -710)`);flash.style.opacity=step&&dt<4?String(0.95*Math.pow(1-dt/4,3)):'0';saved.style.opacity=step===3?String(Math.min(1,Math.max(0,(dt-6)/12))):'0';};
window.seekFrame(0,30);</script></body></html>
