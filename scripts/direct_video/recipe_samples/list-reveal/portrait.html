<!doctype html>
<!-- 来源：list-reveal；上游提交 3ac67b75dd0b3bc2fd807c17f6b7ce35373eef3d --><html lang="zh"><head><meta charset="utf-8"><style>:root{--ink:#121317;--paper:#f3eee6;--accent:#ff5b2e;--mute:#8b8f98;--line:rgba(243,238,230,.14)}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:'PingFang SC','STHeiti','Heiti SC',sans-serif}
.bug{position:absolute;left:96px;right:96px;top:150px;display:flex;justify-content:space-between;align-items:center;font-size:34px;letter-spacing:4px;color:var(--mute)}.bug b{color:var(--paper);font-weight:600;letter-spacing:6px}.bug i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:18px;vertical-align:middle}.rule{position:absolute;left:96px;right:96px;top:230px;height:2px;background:var(--line)}.foot{position:absolute;left:96px;right:96px;bottom:200px;display:flex;justify-content:space-between;font-size:34px;color:var(--mute);letter-spacing:2px}.foot span:last-child{color:var(--paper)}.eyebrow{position:absolute;left:96px;top:500px;font-size:46px;letter-spacing:8px;color:var(--accent);font-weight:600}
.list{position:absolute;left:96px;top:650px;width:888px}.row{height:190px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:25px;font-size:56px;white-space:nowrap}.row:last-child{color:var(--accent)}.number{color:var(--accent);font-size:48px}.meta{margin-left:auto;color:var(--mute);font-size:34px}.row:last-child .meta{color:var(--accent)}</style></head><body><div class="bug" data-role="header"><span><i></i><b>制作台</b></span><span>宣传片 · 06</span></div><div class="rule"></div><div class="eyebrow" id="title">从配乐到成片</div><div class="list" id="list"><div class="row"><span class="number">01</span><span>选一首配乐</span><span class="meta">读出节拍</span></div><div class="row"><span class="number">02</span><span>写分镜</span><span class="meta">一镜一句</span></div><div class="row"><span class="number">03</span><span>挑镜头配方</span><span class="meta">124 张</span></div><div class="row"><span class="number">04</span><span>出成片</span><span class="meta">本机渲染</span></div></div><div class="foot"><span>四步</span><span>一个页面</span></div><script>const D = 4;const clamp=x=>Math.max(0,Math.min(1,x));const back=x=>{x=clamp(x);return 1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};window.seekFrame=(frame,fps)=>{const f=frame*30/fps;document.getElementById('list').style.transform=`translateY(${48-96*clamp(f/119)}px)`;document.querySelectorAll('.row').forEach((row,i)=>{let x=clamp((f-2-i*10)/24),v=back(x);row.style.opacity=Math.min(1,x*2.2);row.style.transform=`translateY(${44*(1-v)}px) scale(${.82+.18*v})`;row.style.filter=`blur(${8*(1-clamp(v))}px)`;row.querySelector('.number').style.opacity=clamp((f-4-i*10)/11);row.querySelector('.meta').style.opacity=clamp((f-6-i*10)/11)});let title=clamp((f-46)/14);document.getElementById('title').style.opacity=title;document.getElementById('title').style.transform=`translateY(${15*(1-title)}px)`};window.seekFrame(0,30);</script></body></html>
