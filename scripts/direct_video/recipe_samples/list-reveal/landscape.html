<!doctype html>
<!-- source: list-reveal; upstream: 3ac67b75dd0b3bc2fd807c17f6b7ce35373eef3d --><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#252b31;color:#f5f6f5;font-family:"STHeiti",sans-serif} header{position:absolute;left:90px;top:58px;font-size:40px;color:#c4cbd0} .title{position:absolute;left:1120px;top:340px;font-size:110px;line-height:1.25} .list{position:absolute;left:180px;top:155px;width:800px;}
.list:before{content:"";position:absolute;left:0;right:0;top:0;height:92px;border:2px solid #4c565e;border-radius:14px;opacity:.5}.row{height:92px;margin-bottom:14px;background:#343c43;border:2px solid #4c565e;border-radius:14px;display:flex;align-items:center;padding:0 35px;box-sizing:border-box;font-size:46px;transform-origin:center;position:relative;overflow:hidden} .row:first-child{background:#f2f3f1;color:#222b31;border-color:#f2f3f1} .icon{width:35px;height:35px;border:4px solid currentColor;border-radius:9px;margin-right:35px;box-sizing:border-box} .meta{margin-left:auto;font-size:34px;opacity:.75} .shine{position:absolute;top:0;bottom:0;width:18%;left:0;background:#ffffff66;transform:translateX(-300%) skewX(-20deg)}
</style></head><body><header data-role="header">界面导航</header><div class="title" id="title">一目了然<br>逐项展开</div><div class="list" id="list"><div class="row"><i class="shine"></i><i class="icon"></i>首页<span class="meta">概览</span></div><div class="row"><i class="icon"></i>项目<span class="meta">整理</span></div><div class="row"><i class="icon"></i>素材<span class="meta">浏览</span></div><div class="row"><i class="icon"></i>收藏<span class="meta">查看</span></div><div class="row"><i class="icon"></i>设置<span class="meta">管理</span></div><div class="row"><i class="icon"></i>退出<span class="meta">结束</span></div></div><script>
const D = 4; const clamp=x=>Math.max(0,Math.min(1,x));const back=x=>{x=clamp(x);return 1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
window.seekFrame=(frame,fps)=>{const f=frame*30/fps;document.getElementById('list').style.transform=`translateY(${48-96*clamp(f/119)}px)`;document.querySelectorAll('.row').forEach((row,i)=>{let x=clamp((f-2-i*10)/24),v=back(x);row.style.opacity=Math.min(1,x*2.2);row.style.transform=`translateY(${44*(1-v)}px) scale(${.82+.18*v})`;row.style.filter=`blur(${8*(1-clamp(v))}px)`;row.querySelector('.icon').style.opacity=clamp((f-4-i*10)/11);row.querySelector('.meta').style.opacity=.75*clamp((f-6-i*10)/11)});let title=clamp((f-46)/14);document.getElementById('title').style.opacity=title;document.getElementById('title').style.transform=`translateY(${15*(1-title)}px)`;document.querySelector('.shine').style.transform=`translateX(${-300+900*clamp((f-26)/15)}%) skewX(-20deg)`};window.seekFrame(0,30);
</script></body></html>
