<!doctype html>
<!-- 来源：product-card-progressive-assemble；上游提交 3ac67b75dd0b3bc2fd807c17f6b7ce35373eef3d --><html lang="zh"><head><meta charset="utf-8"><style>:root{--ink:#121317;--paper:#f3eee6;--accent:#ff5b2e;--mute:#8b8f98;--line:rgba(243,238,230,.14)}:root{--line:rgba(18,19,23,.12);--mute:#6b6f78}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'PingFang SC','STHeiti','Heiti SC',sans-serif}
.bug{position:absolute;left:120px;right:120px;top:80px;display:flex;justify-content:space-between;align-items:center;font-size:30px;letter-spacing:4px;color:var(--mute)}.bug b{color:var(--ink);font-weight:600;letter-spacing:6px}.bug i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:18px;vertical-align:middle}.rule{position:absolute;left:120px;right:120px;top:150px;height:2px;background:var(--line)}.foot{position:absolute;left:120px;right:120px;bottom:90px;display:flex;justify-content:space-between;font-size:30px;color:var(--mute);letter-spacing:2px}.foot span:last-child{color:var(--ink)}.eyebrow{position:absolute;left:120px;top:420px;font-size:40px;letter-spacing:8px;color:var(--accent);font-weight:600}
.card{position:absolute;box-sizing:border-box;left:970px;top:245px;width:750px;height:610px;border:2px solid var(--ink);border-radius:28px;background:#fbf8f3;padding:40px;transform-origin:center}.identity{display:flex;align-items:center;gap:30px}.icon{width:115px;height:115px;background:var(--accent);color:white;display:grid;place-items:center;font-size:80px;font-weight:700}.name{font-size:76px;font-weight:700}.subtitle{font-size:36px;color:var(--mute)}.pills{display:flex;gap:18px;margin-top:30px}.pill{border:2px solid var(--ink);padding:12px 22px;font-size:32px}.data{font-size:36px;margin-top:36px;white-space:nowrap}.button{margin-top:36px;height:92px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:36px;transform-origin:left}.cursor{position:absolute;border:3px solid var(--accent);box-sizing:border-box;pointer-events:none}.data{position:relative;isolation:isolate}.data:before{content:"";position:absolute;inset:0;background:rgba(255,91,46,.2);transform:scaleX(var(--highlight,0));transform-origin:left;z-index:-1}</style></head><body><div class="bug" data-role="header"><span><i></i><b>制作台</b></span><span>宣传片 · 05</span></div><div class="rule"></div><div class="eyebrow">这次做的是什么</div><div class="card" id="card"><div class="identity"><div class="icon" id="icon">制</div><div id="title"><div class="name">制作台</div><div class="subtitle">宣传片生产线</div></div></div><div class="pills"><div class="pill">竖屏</div><div class="pill">横屏</div><div class="pill">按拍切</div></div><div class="data" id="data">124 张镜头配方 · 10 种风格</div><div class="button" id="button">开始做片</div><div class="cursor" id="cursor"></div></div><div class="foot"><span>本机运行</span><span>免费</span></div><script>const D = 5.733;const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>1-Math.pow(1-clamp(x),4);const q=(f,s,n=14)=>ease((f-s)/n);function place(el,v,dy=18){el.style.opacity=v;el.style.transform=`translateY(${(1-v)*dy}px)`;el.style.filter=`blur(${(1-v)*6}px)`}window.seekFrame=(frame,fps)=>{const f=frame*30/fps;const card=document.getElementById('card');card.style.transform=`translateY(${30*(1-q(f,0))}px) scale(${(.96+.04*q(f,0))*(1+.035*clamp(f/132))})`;place(document.getElementById('icon'),q(f,10));place(document.getElementById('title'),q(f,22),26);document.querySelectorAll('.pill').forEach((e,i)=>{let x=q(f,32+i*3);e.style.opacity=x;e.style.transform=`scale(${.4+.6*x+.04*Math.sin(Math.PI*x)})`});place(document.getElementById('data'),q(f,44));document.getElementById('button').style.transform=`scaleX(${q(f,116,12)})`;document.getElementById('button').style.opacity=q(f,122,8);document.getElementById('data').style.setProperty('--highlight',q(f,86,6));const targets=[document.getElementById('icon'),document.getElementById('title'),document.querySelector('.pills'),document.getElementById('data'),document.getElementById('data'),document.querySelector('.pills'),document.getElementById('button')],times=[8,20,30,42,76,96,114];let i=0;while(i<6&&f>=times[i+1])i++;let a=targets[Math.max(0,i-1)],b=targets[i],v=i===0?1:q(f,times[i],6),cr=card.getBoundingClientRect(),ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),scale=cr.width/card.offsetWidth,mix=(x,y)=>x+(y-x)*v,cursor=document.getElementById('cursor');cursor.style.left=mix((ar.left-cr.left)/scale,(br.left-cr.left)/scale)+'px';cursor.style.top=mix((ar.top-cr.top)/scale,(br.top-cr.top)/scale)+'px';cursor.style.width=mix(ar.width/scale,br.width/scale)+'px';cursor.style.height=mix(ar.height/scale,br.height/scale)+'px';cursor.style.opacity=clamp((f-2)/6)*(1-clamp((f-122)/8))};window.seekFrame(0,30);</script></body></html>
