n);let s=ease((f-60)/58),len=2*Math.PI*290;arc.setAttribute('stroke-dasharray',`${s*len} ${len}`);arc.style.opacity=open;document.getElementById('num').textContent=Math.round(s*100)+'%'};window.seekFrame(0,30);</script></body></html>
