<!doctype html>
<!-- 来源卡 circle-match-iris；上游提交 3ac67b75dd0b3bc2fd807c17f6b7ce35373eef3d --><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:"STHeiti",sans-serif}svg{position:absolute;inset:0}#new{clip-path:circle(0px at 960px 490px)}#old{transform-origin:960px 490px}</style></head><body><div data-role="header"></div><svg id="old" width="1920" height="1080"><rect width="1920" height="1080" fill="#101d1b"/><text x="90" y="150" fill="#e7f5ea" font-size="54">本周进度</text><text x="90" y="230" fill="#a9c6b5" font-size="38">创作概览</text><rect x="560" y="404" width="800" height="172" rx="25" fill="#263c34"/><circle cx="960" cy="490" r="36" fill="#b9ef81"/><text x="640" y="505" fill="#ecf8e9" font-size="42">我的项目</text><text x="1070" y="505" fill="#c7dfcb" font-size="38">查看进度</text><circle id="pulse" cx="960" cy="490" r="36" fill="none" stroke="#b9ef81" stroke-width="5"/></svg><svg id="new" width="1920" height="1080"><rect width="1920" height="1080" fill="#eaf2e6"/><text x="90" y="150" fill="#1b3024" font-size="54">项目进度</text><text x="90" y="225" fill="#526c58" font-size="38">当前完成情况</text><circle id="track" cx="960" cy="490" r="250" fill="none" stroke="#bdcdbb" stroke-width="44"/><circle id="arc" cx="960" cy="490" r="250" fill="none" stroke="#37764b" stroke-width="44" stroke-linecap="round" transform="rotate(-90 960 490)"/><text id="num" x="960" y="522" text-anchor="middle" fill="#1a3d28" font-size="110">0%</text><text x="960" y="595" text-anchor="middle" fill="#526c58" font-size="36">目标进度</text></svg><script>
const D = 5.5;
const cx=960, cy=490, radius=250; const old=document.getElementById('old'), scene=document.getElementById('new'), arc=document.getElementById('arc'), num=document.getElementById('num'), pulse=document.getElementById('pulse'), track=document.getElementById('track');
const clamp=x=>Math.max(0,Math.min(1,x)); const ease=x=>1-Math.pow(1-clamp(x),3);
window.seekFrame=(frame,fps)=>{const f=frame*30/fps; const focus=clamp(f/40); const pre=clamp((f-40)/7); const open=ease((f-47)/28); const spread=Math.pow(clamp((f-54)/30),2); let r=(36+(radius-36)*open)+22*open+2400*spread; scene.style.clipPath=`circle(${f<47?0:r}px at ${cx}px ${cy}px)`; old.style.transform=`scale(${1+.03*focus+.19*Math.pow(clamp((f-47)/34),2)})`; old.style.filter=`brightness(${1-.55*clamp((f-47)/34)})`; let wave=Math.max(0,1-Math.abs(f-23)/12,1-Math.abs(f-35)/12); pulse.setAttribute('r',36+wave*35-pre*4); pulse.setAttribute('opacity',wave*.8); track.setAttribute('r',36+(radius-36)*open); track.setAttribute('stroke-width',72-28*open); let s=ease((f-60)/58)*.87; let len=2*Math.PI*radius; arc.setAttribute('stroke-dasharray',`${s*len} ${len}`); num.textContent=Math.round(s*100)+'%';};window.seekFrame(0,30);
</script></body></html>
