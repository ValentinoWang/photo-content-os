</style></head><body data-hold="1.4-2.5"><div class="bug" data-role="header"><span><i></i><b>制作台</b></span><span>宣传片 · 02</span></div><div class="rule"></div><div class="page" data-role="header"><div class="eyebrow">以前剪一条要一下午</div><div class="title"><span class="first">30 秒</span><span class="word">的片子</span><span class="second"><span class="keyword">今晚<span class="ink"><svg viewBox="0 0 300 30" preserveAspectRatio="none"><path class="line" fill="var(--accent)" d="M0 22 L17 19 L34 20 L53 16 L76 17 L99 13 L122 14 L145 10 L168 12 L190 8 L213 9 L237 5 L260 6 L282 3 L300 3 L299 12 L281 13 L260 17 L238 16 L214 20 L190 19 L168 23 L144 22 L121 26 L98 24 L75 27 L53 25 L33 28 L16 26 L0 28 Z"/></svg></span></span>就能发</span></div></div><div class="foot"><span>宣传片</span><span>第 4–6 小节</span></div><script>
const D = 2.5;const clamp=x=>Math.max(0,Math.min(1,x));const out=x=>1-Math.pow(1-clamp(x),3);const lines=[document.querySelector('.first'),document.querySelector('.word'),document.querySelector('.second')],ink=document.querySelector('.line');window.seekFrame=function(frame,fps){lines.forEach((el,i)=>{const p=out((frame-i*5)/12);el.style.opacity=0.18+0.82*p;el.style.transform=`translateY(${(1-p)*24}px)`});ink.style.transform=`scaleX(${out((frame-32)/10)})`};window.seekFrame(0,30);
