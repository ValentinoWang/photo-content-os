<!doctype html>
<!-- 来源：spotlight-hero-card；上游提交 3ac67b75dd0b3bc2fd807c17f6b7ce35373eef3d --><html lang="zh"><head><meta charset="utf-8"><style>:root{--ink:#121317;--paper:#f3eee6;--accent:#ff5b2e;--mute:#8b8f98;--line:rgba(243,238,230,.14)}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:'PingFang SC','STHeiti','Heiti SC',sans-serif}

h.sin((f-66)*Math.PI/20)*4;document.getElementById('hero').style.transform=`translate(${push*30}px,${-lift*38+bob}px) scale(${1+push*.12+lift*.025})`;let lap=f>=68&&f<82?(f-68)/14:f>=88&&f<108?(f-88)/20:0,scan=document.getElementById('scan');scan.setAttribute('opacity',f>=68&&f<82?1:f>=88&&f<108?.62:0);scan.setAttribute('stroke-dashoffset',-lap);document.getElementById('annotation').style.opacity=smooth((f-65)/12)};window.seekFrame(0,30);</script></body></html>
