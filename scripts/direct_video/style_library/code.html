</style></head><body data-hold="8.4-12"><header data-role="header"><div class="eyebrow">聚光灯效应</div><div class="title">真有那么多人在看<span class="fw">？</span></div></header><div class="editor"><div class="tab"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="file">spotlight.js</span></div><div class="lines" id="lines"></div></div><div class="preview"><div class="preview-title">结果预览</div><div class="numbers"><div class="col" id="expected"><div class="label">以为约</div><div class="number" id="ne">50%</div></div><div class="col" id="actual"><div class="label">实际约</div><div class="number" id="na">25%</div></div></div></div><div class="source">Gilovich 等，2000 · 示意图，非原始数据</div><script>
const D = 12;
const $=id=>document.getElementById(id),cl=x=>Math.max(0,Math.min(1,x)),p=(t,s,d)=>1-(1-cl((t-s)/d))**3;
const rows=[{start:-1,dur:.5,tokens:[['kw','const '],['name','study = {']]},{start:2.4,dur:1.2,tokens:[['name','  expected: '],['val','50'],['name',',']]},{start:4.8,dur:1.2,tokens:[['name','  observed: '],['val','25']]},{start:6.1,dur:.25,tokens:[['name','};']]},{start:6.6,dur:1.1,tokens:[['fn','compare'],['name','(study);']]}];
const lineElements=rows.map((row,i)=>{const line=document.createElement('div');line.className='line';const ln=document.createElement('span');ln.className='ln';ln.textContent=i+1;line.append(ln);const spans=row.tokens.map(([kind])=>{const span=document.createElement('span');span.className=kind;line.append(span);return span;});const cursor=document.createElement('i');cursor.className='cursor';line.append(cursor);$('lines').append(line);return {line,spans,cursor};});
window.seekFrame=(frame,fps)=>{const t=frame/fps,active=rows.findLastIndex(row=>t>=row.start);rows.forEach((row,i)=>{const n=Math.floor(row.tokens.reduce((a,b)=>a+b[1].length,0)*cl((t-row.start)/row.dur)),els=lineElements[i],typing=active===i&&t<7.7;els.line.className='line'+(typing?' active':'');els.cursor.style.display=typing?'inline-block':'none';let left=n;row.tokens.forEach(([kind,text],j)=>{const visible=text.slice(0,Math.max(0,left));if(els.spans[j].textContent!==visible)els.spans[j].textContent=visible;left-=text.length;});});for(const [id,num,start] of [['expected',50,3.6],['actual',25,6]]){$(id).style.opacity=p(t,start,.25);const el=$(id==='expected'?'ne':'na'),text=Math.round(num*p(t,start,1.4))+'%';if(el.textContent!==text)el.textContent=text;}};
window.seekFrame(0,30);
</script></body></html>
