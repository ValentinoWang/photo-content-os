</style></head><body data-hold="8.4-12"><canvas id="cv" width="180" height="320"></canvas><header data-role="header"><div class="eyebrow">聚光灯效应</div><div class="title">真有那么多人在看<span class="fw">？</span></div></header><div class="label" id="la">以为约</div><div class="label" id="lb">实际约</div><div class="source">Gilovich 等，2000 · 示意图，非原始数据</div><script>
const D = 12;
const $=id=>document.getElementById(id),c=$('cv').getContext('2d'),cl=x=>Math.max(0,Math.min(1,x)),p=(t,s,d)=>1-(1-cl((t-s)/d))**3;
const digits={'0':['11111','10001','10011','10101','11001','10001','11111'],'1':['00100','01100','00100','00100','00100','00100','01110'],'2':['11111','00001','00001','11111','10000','10000','11111'],'3':['11111','00001','00001','01111','00001','00001','11111'],'4':['10001','10001','10001','11111','00001','00001','00001'],'5':['11111','10000','10000','11111','00001','00001','11111'],'6':['11111','10000','10000','11111','10001','10001','11111'],'7':['11111','00001','00010','00100','01000','01000','01000'],'8':['11111','10001','10001','11111','10001','10001','11111'],'9':['11111','10001','10001','11111','00001','00001','11111'],'%':['11001','11010','00010','00100','01000','01011','10011']};
function bitmap(rows,x,y,s,color){c.fillStyle=color;rows.forEach((row,j)=>[...row].forEach((v,i)=>{if(v==='1')c.fillRect(Math.round(x+i*s),Math.round(y+j*s),s,s);}));}
function number(n,x,y,color){[...(Math.round(n)+'%')].forEach((ch,i)=>bitmap(digits[ch],x+i*24,y,4,color));}
const head=['011110','111111','110011','111111','011110'],body=['011110','111111','111111','101101','101101'];
function person(x,y,color,look){bitmap(head,x+2,y,2,color);bitmap(body,x+2,y+11,2,color);c.fillStyle=look?'#2b1b4d':'#8c77ae';c.fillRect(x+5+(look?0:2),y+4,2,2);c.fillRect(x+10+(look?0:2),y+4,2,2);}
window.seekFrame=(frame,fps)=>{const t=frame/fps;c.imageSmoothingEnabled=false;c.fillStyle='#2b1b4d';c.fillRect(0,0,180,320);c.fillStyle='#6b3fa0';for(let i=0;i<6;i++)c.fillRect(12+i*27,65+(i%2)*8,23,35);c.fillStyle='#c7b8df';for(const [x,y] of [[25,55],[154,58],[62,68]]){c.fillRect(x,y,1,3);c.fillRect(x-1,y+1,3,1);}c.fillStyle='#1f7a4d';for(let x=12;x<168;x+=4)c.fillRect(x,151-Math.round(Math.sin(x*.1)*6),4,20);c.fillStyle='#2f9e5f';c.fillRect(12,155,156,4);c.fillStyle='#3a275b';c.fillRect(12,159,156,8);c.fillStyle='#c7b8df';c.fillRect(17,88,3,64);c.fillRect(17,88,35,3);c.fillRect(49,88,3,64);
const step=cl(t/1.6),x=29+Math.floor(14*step);person(x,124,'#ff8a3d',true);c.fillStyle='#ffd84a';c.fillRect(x+5,139,3,3);c.fillRect(x+11,144,3,3);
for(let i=0;i<8;i++){const expected=i<4&&p(t,2.8,1.4)>i/6,actual=t>=5.2;if(actual&&i>=2){person(75+i%4*23,94+Math.floor(i/4)*32,'#8c77ae',false);}else person(75+i%4*23,94+Math.floor(i/4)*32,expected?'#ffd84a':'#c7b8df',expected);}
c.fillStyle='#6b3fa0';c.fillRect(16,177,148,1);c.fillRect(16,210,148,1);c.fillRect(16,244,148,1);$('la').style.opacity=p(t,2.8,.25);$('lb').style.opacity=p(t,5.2,.25);if(t>=2.8)number(50*p(t,2.8,1.4),92,178,'#ffffff');if(t>=5.2)number(25*p(t,5.2,1.4),92,211,'#ffd84a');if(t>=7){c.fillStyle='#ffd84a';const w=Math.floor(26*p(t,7,.7));c.fillRect(115,242,w,2);}};
