</style></head><body data-hold="8.4-12"><canvas id="bg" width="1080" height="1920"></canvas><canvas id="cv" width="1080" height="1920"></canvas><header data-role="header"><div class="eyebrow">聚光灯效应</div><div class="title">真有那么多人在看<span class="fw">？</span></div></header><div class="vertical">他人的目光</div><div class="row" id="expected"><div class="label">以为约</div><div class="number" id="ne">50%</div></div><div class="row" id="actual"><div class="label">实际约</div><div class="number" id="na">25%</div></div><div class="seal" id="seal">半</div><div class="source">Gilovich 等，2000 · 示意图，非原始数据</div><script>
const D = 12;
const $=id=>document.getElementById(id),b=$('bg').getContext('2d'),c=$('cv').getContext('2d'),cl=x=>Math.max(0,Math.min(1,x)),p=(t,s,d)=>1-(1-cl((t-s)/d))**3;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const r=rng(600),im=b.createImageData(1080,1920);for(let i=0;i<im.data.length;i+=4){const n=(r()-.5)*12;im.data[i]=234+n;im.data[i+1]=227+n;im.data[i+2]=214+n;im.data[i+3]=255;}b.putImageData(im,0,0);b.strokeStyle='rgba(109,103,94,.06)';b.lineWidth=1;for(let i=0;i<1700;i++){let x=r()*1080,y=r()*1920;b.beginPath();b.moveTo(x,y);b.lineTo(x+2+r()*5,y+8+r()*15);b.stroke();}
// Three fixed ridgelines, with translucent washes instead of moving scenery.
for(let layer=0;layer<3;layer++){const y0=1300+layer*70,points=[];for(let x=72;x<=1008;x+=8){const y=y0-65*Math.sin(x*.006+layer*2)-27*Math.sin(x*.019+layer)-15*Math.sin(x*.051);points.push([x,y]);}b.beginPath();b.moveTo(...points[0]);for(const q of points)b.lineTo(...q);b.lineTo(1008,1520);b.lineTo(72,1520);b.closePath();const wash=b.createLinearGradient(0,y0-100,0,1540);wash.addColorStop(0,'rgba(44,42,39,'+(.12+layer*.06)+')');wash.addColorStop(1,'rgba(44,42,39,0)');b.fillStyle=wash;b.fill();}
function stroke(x,y,length,color,seed){const rr=rng(seed);c.fillStyle=color;for(let k=0;k<12;k++){c.globalAlpha=.035+rr()*.07;c.beginPath();c.moveTo(x,y-14+rr()*12);for(let a=0;a<=length;a+=8)c.lineTo(x+a,y-10+rr()*8);c.lineTo(x+length,y+17);for(let a=length;a>=0;a-=8)c.lineTo(x+a,y+8+rr()*10);c.closePath();c.fill();}c.globalAlpha=1;}
window.seekFrame=(frame,fps)=>{const t=frame/fps;c.clearRect(0,0,1080,1920);stroke(96,810,700,'#4a4640',7);stroke(96,1230,700,'#4a4640',8);stroke(96,810,700*p(t,2.8,1.4),'#2c2a27',9);stroke(96,1230,350*p(t,5.1,1.4),'#b03a2e',10);for(const [id,n,start] of [['expected',50,2.8],['actual',25,5.1]]){$(id).style.opacity=p(t,start,.6);$(id==='expected'?'ne':'na').textContent=Math.round(n*p(t,start,1.4))+'%';}const k=p(t,7.1,.7);$('seal').style.opacity=k;c.globalAlpha=k;c.strokeStyle='#b03a2e';c.lineWidth=4;c.beginPath();c.moveTo(796,835);c.bezierCurveTo(860,870,860,1140,450,1205);c.stroke();c.beginPath();c.moveTo(474,1181);c.lineTo(450,1205);c.lineTo(488,1214);c.stroke();c.globalAlpha=1;};
window.seekFrame(0,30);
</script></body></html>
