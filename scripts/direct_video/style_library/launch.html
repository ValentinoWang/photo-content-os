<!DOCTYPE html><html lang='zh'><head><meta charset='utf-8'><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#050505}
body{position:relative;font-family:'STHeiti','Heiti SC',sans-serif;color:#f7f7f5}
.fw{display:inline-block;width:1em;text-align:center}
.a{position:absolute}
#cv{position:absolute;left:0;top:0;width:1080px;height:1920px}
#hd{left:72px;top:112px;width:936px;text-align:center;z-index:2}
#eb{font-size:44px;line-height:1.2;color:#8f97a3;white-space:nowrap}
.tt{font-size:72px;line-height:1.2;color:#f7f7f5;margin-top:22px}
.col{top:1118px;width:468px;text-align:center;z-index:2}
#cE{left:72px}
#cA{left:540px}
.cap{font-size:44px;line-height:1.2;color:#8f97a3}
.num{display:inline-block;font-size:168px;line-height:1.1;margin-top:14px;white-space:nowrap;color:transparent;-webkit-background-clip:text;background-clip:text}
#nE{background-image:linear-gradient(180deg,#f7f7f5 0%,#cfd4dc 48%,#8f97a3 100%)}
#nA{background-image:linear-gradient(90deg,#a58bff 0%,#6f8cff 48%,#ff8a5c 100%)}
#dv{left:539px;top:1136px;width:2px;height:226px;background:#26272b}
#sum{left:72px;top:1396px;width:936px;text-align:center;font-size:44px;line-height:1.2;color:#f7f7f5;white-space:nowrap;z-index:2}
#src{left:72px;top:1470px;width:936px;text-align:center;font-size:34px;line-height:1.2;color:#8f97a3;white-space:nowrap;z-index:2}
</style></head><body data-hold='8-12'>
<canvas id='cv' width='1080' height='1920'></canvas>
<div id='hd' class='a' data-role='header'><div id='eb'>聚光灯效应</div><div class='tt'>真有那么多人在看<span class='fw'>？</span></div></div>
<div id='dv' class='a'></div>
<div id='cE' class='a col'><div class='cap' id='kE'><span>以</span><span>为</span><span>约</span></div><div id='nE' class='num'>50%</div></div>
<div id='cA' class='a col'><div class='cap' id='kA'><span>实</span><span>际</span><span>约</span></div><div id='nA' class='num'>25%</div></div>
<div id='sum' class='a'>只有你以为的一半</div>
<div id='src' class='a'>Gilovich 等，2000 · 示意图，非原始数据</div>
<script>
const D = 12;
const W=1080,H=1920,PI=Math.PI,TAU=2*PI;
const $=id=>document.getElementById(id);
const cv=$('cv'),c=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');
const cl=x=>x<0?0:x>1?1:x;
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const p=(t,s,d)=>eo((t-s)/d);
const T={est:2.9,act:5.0,sweep:6.8,sum:6.9,src:7.3};
// 戒指：圆环面网格，金属反射靠一个假的影棚环境
const NU=168,NV=30,RR=300,rr=54,F=2600,CX=540,CY=676,H0=118;
const nrm=(x,y,z)=>{const l=Math.hypot(x,y,z);return [x/l,y/l,z/l];};
const LP=nrm(-0.85,0.25,0.5),LO=nrm(0.9,0.05,-0.42),LK=nrm(-0.25,0.85,-0.45);
const tm=x=>Math.round(255*(1-Math.exp(-1.35*x)));
function env(rx,ry,rz,sw){
 let L=0.03+0.07*Math.max(0,ry);
 L+=0.6*Math.exp(-Math.pow((ry-0.1)/0.09,2));
 L+=0.85*Math.exp(-Math.pow((ry-0.93)/0.13,2))*Math.exp(-Math.pow(rx/0.5,2));
 const az=Math.atan2(rx,-rz);
 L+=1.25*Math.exp(-Math.pow((az-sw)/0.17,2))*cl((ry+0.35)/0.3)*cl((0.9-ry)/0.3);
 return L;
}
function shade(nx,ny,nz,ix,iy,iz,sw){
 const d=nx*ix+ny*iy+nz*iz;
 const rx=ix-2*d*nx,ry=iy-2*d*ny,rz=iz-2*d*nz;
 const fr=Math.pow(1-Math.abs(d),3);
 const L=env(rx,ry,rz,sw)*(0.75+0.6*fr);
 const pp=Math.pow(Math.max(0,rx*LP[0]+ry*LP[1]+rz*LP[2]),5)*(1.0+1.6*fr);
 const po=Math.pow(Math.max(0,rx*LO[0]+ry*LO[1]+rz*LO[2]),6)*(0.9+1.2*fr);
 const sp=Math.pow(Math.max(0,rx*LK[0]+ry*LK[1]+rz*LK[2]),70)*2.4;
 return 'rgb('+tm(0.81*L+0.65*pp+1.0*po+sp)+','+tm(0.83*L+0.55*pp+0.54*po+sp)+','+tm(0.86*L+1.0*pp+0.36*po+sp)+')';
}
const VX=new Float32Array(NU*NV),VY=new Float32Array(NU*NV),VZ=new Float32Array(NU*NV);
function project(x,y,z,ce,se){const y2=y*ce+z*se,z2=-y*se+z*ce,k=F/(F+z2);return [CX+x*k,CY-y2*k,z2];}
function ring(ctx,e,mirror,sw){
 const ce=Math.cos(e),se=Math.sin(e);
 for(let i=0;i<NU;i++){const u=i*TAU/NU,cu=Math.cos(u),su=Math.sin(u);
  for(let j=0;j<NV;j++){const v=j*TAU/NV,cv2=Math.cos(v);let X=(RR+rr*cv2)*cu,Y=rr*Math.sin(v),Z=(RR+rr*cv2)*su;if(mirror)Y=-2*H0-Y;
   const q=project(X,Y,Z,ce,se),id=i*NV+j;VX[id]=q[0];VY[id]=q[1];VZ[id]=q[2];}}
 const list=[];
 for(let i=0;i<NU;i++){const uc=(i+0.5)*TAU/NU,cu=Math.cos(uc),su=Math.sin(uc),i2=(i+1)%NU;
  for(let j=0;j<NV;j++){const vc=(j+0.5)*TAU/NV,cvv=Math.cos(vc),j2=(j+1)%NV;
   let nx=cvv*cu,ny=Math.sin(vc),nz=cvv*su;if(mirror)ny=-ny;
   const ny2=ny*ce+nz*se,nz2=-ny*se+nz*ce;
   let X=(RR+rr*cvv)*cu,Y=rr*Math.sin(vc),Z=(RR+rr*cvv)*su;if(mirror)Y=-2*H0-Y;
   const py=Y*ce+Z*se,pz=-Y*se+Z*ce+F;
   if(nx*X+ny2*py+nz2*pz>=0)continue;
   const il=Math.hypot(X,py,pz);
   list.push([pz,i*NV+j,i*NV+j2,i2*NV+j2,i2*NV+j,shade(nx,ny2,nz2,X/il,py/il,pz/il,sw)]);
  }}
 list.sort((a,b)=>b[0]-a[0]);
 ctx.lineWidth=1;ctx.lineJoin='round';
 for(const q of list){ctx.fillStyle=ctx.strokeStyle=q[5];ctx.beginPath();ctx.moveTo(VX[q[1]],VY[q[1]]);ctx.lineTo(VX[q[2]],VY[q[2]]);ctx.lineTo(VX[q[3]],VY[q[3]]);ctx.lineTo(VX[q[4]],VY[q[4]]);ctx.closePath();ctx.fill();ctx.stroke();}
}
function hexmix(a,b,k){const A=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),B=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';}
function grad3(k){return k<0.5?hexmix('#a58bff','#6f8cff',k*2):hexmix('#6f8cff','#ff8a5c',(k-0.5)*2);}
function led(e,from,frac,colorAt,wid,glow){
 if(frac<=0.001)return;
 const ce=Math.cos(e),se=Math.sin(e),n=Math.max(2,Math.ceil(frac*220));
 const P=[];for(let q=0;q<=n;q++){const u=PI/2-TAU*(from+frac*q/n);P.push(project(RR*Math.cos(u),rr+1,RR*Math.sin(u),ce,se));}
 c.save();c.lineCap='round';
 for(const pass of glow?[0,1]:[1]){
  for(let q=0;q<n;q++){const col=colorAt(q/n);c.strokeStyle=pass?col:col;c.shadowColor=col;c.shadowBlur=pass?0:26;c.lineWidth=pass?wid:wid*1.6;c.globalAlpha=pass?1:0.7;
   c.beginPath();c.moveTo(P[q][0],P[q][1]);c.lineTo(P[q+1][0],P[q+1][1]);c.stroke();}
 }
 c.restore();
}
function bg(){
 const g=c.createRadialGradient(CX,CY,40,CX,CY,1150);g.addColorStop(0,'#141418');g.addColorStop(0.42,'#0b0b0d');g.addColorStop(1,'#050505');
 c.fillStyle=g;c.fillRect(0,0,W,H);
 const gp=c.createRadialGradient(250,600,0,250,600,440);gp.addColorStop(0,'rgba(165,139,255,.20)');gp.addColorStop(1,'rgba(165,139,255,0)');
 c.fillStyle=gp;c.fillRect(0,0,W,H);
 const go=c.createRadialGradient(850,840,0,850,840,400);go.addColorStop(0,'rgba(255,138,92,.14)');go.addColorStop(1,'rgba(255,138,92,0)');
 c.fillStyle=go;c.fillRect(0,0,W,H);
}
function flash(el,t,s){
 const sp=el.children;
 for(let i=0;i<sp.length;i++){const st=s+i*0.12,k=cl((t-st)/0.16);sp[i].style.opacity=k;sp[i].style.color=hexmix('#ffffff','#8f97a3',p(t,st+0.1,0.5));}
}
window.seekFrame=(frame,fps)=>{
 const t=frame/fps;
 const e=(14+36*eio(t/3.2))*PI/180;
 const sw=-0.95+1.9*eio((t-T.sweep)/1.1);
 bg();
 o.clearRect(0,0,W,H);ring(o,e,true,sw);
 o.globalCompositeOperation='destination-in';
 const m=o.createLinearGradient(0,CY,0,CY+480);m.addColorStop(0,'rgba(0,0,0,.34)');m.addColorStop(1,'rgba(0,0,0,0)');
 o.fillStyle=m;o.fillRect(0,0,W,H);o.globalCompositeOperation='source-over';
 c.drawImage(off,0,0);
 ring(c,e,false,sw);
 // LED 细环：以为 = 一半，实际 = 四分之一
 const fE=0.5*eo((t-T.est-0.1)/1.4),gE=p(t,T.act,0.4),fA=0.25*eo((t-T.act-0.1)/1.4);
 led(e,0,fE,()=>hexmix('#f7f7f5','#44474e',gE),gE>0.5?6:8,gE<0.5);
 led(e,0,fA,k=>grad3(k*fA/0.25),10,true);
 const ls=0.4-0.28*eo(t/1.6);
 $('eb').style.letterSpacing=ls+'em';$('eb').style.paddingLeft=ls+'em';
 flash($('kE'),t,T.est);flash($('kA'),t,T.act);
 $('nE').textContent=Math.round(50*eo((t-T.est-0.1)/1.4))+'%';$('nE').style.opacity=p(t,T.est+0.1,0.3);
 $('nA').textContent=Math.round(25*eo((t-T.act-0.1)/1.4))+'%';$('nA').style.opacity=p(t,T.act+0.1,0.3);
 $('dv').style.opacity=p(t,T.est,0.5);
 const sl=0.4-0.28*eo((t-T.sum)/1.1);
 $('sum').style.opacity=p(t,T.sum,0.5);$('sum').style.letterSpacing=sl+'em';$('sum').style.paddingLeft=sl+'em';
 $('src').style.opacity=p(t,T.src,0.4);
};
window.seekFrame(0,30);
</script></body></html>
